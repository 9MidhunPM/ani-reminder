services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ani_reminder
      POSTGRES_USER: ani_reminder
      POSTGRES_PASSWORD: ani_reminder
    ports:
      - "5432:5432"
    volumes:
      - ani-reminder-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ani_reminder -d ani_reminder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ani-reminder-postgres:
